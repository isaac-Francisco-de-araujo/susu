spring.application.name=studio-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:database/migration
spring.mvc.problemdetails.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STUDIO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-directory=${UPLOAD_DIRECTORY:./data/uploads}
app.backup-enabled=${BACKUP_ENABLED:true}
app.backup-directory=${BACKUP_DIRECTORY:./data/backups}
app.backup-retention=7
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
